name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Check if first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;
            const { data: contributions } = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });

            // Check if this is an issue or PR
            const isIssue = context.eventName === 'issues';
            const number = context.payload.issue?.number || context.payload.pull_request?.number;

            // Get user's issue/PR count
            const { data: userIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: creator,
              state: 'all',
              per_page: 1,
            });

            const isPR = context.eventName === 'pull_request_target';

            // For first-timers: issues count <= 1 (their current one), PRs count <= 1
            const issueCount = userIssues.length;
            const is_first_time = issueCount <= 1;

            if (is_first_time) {
              const welcomeMessage = isPR
                ? `🎉 Welcome to Neural Aurora Docs, @${creator}!\n\nThank you for your first pull request! We'll review it soon.\n\nPlease make sure you've read our [Contributing Guide](https://github.com/Techhackontime999/neural-aurora-docs/blob/main/.github/CONTRIBUTING.md) and that your PR passes all checks.\n\nIf you have any questions, feel free to ask in the PR comments or open a [Discussion](https://github.com/Techhackontime999/neural-aurora-docs/discussions).`
                : `👋 Welcome to Neural Aurora Docs, @${creator}!\n\nThank you for opening your first issue! We'll review it soon.\n\nTo help us address this faster, please make sure you've filled out all the sections in the issue template.\n\nIf you have any questions, feel free to ask here or open a [Discussion](https://github.com/Techhackontime999/neural-aurora-docs/discussions).`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: welcomeMessage,
              });

              console.log(`Welcomed first-time contributor: ${creator}`);
            } else {
              console.log(`Not a first-time contributor: ${creator} (${issueCount} issues)`);
            }
